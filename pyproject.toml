[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-station-cad"
version = "0.9.0"
description = "Parametric FDM enclosure for Mac mini M4, Teltonika RUTM30, and Mean Well APV-35-36"
requires-python = ">=3.10,<3.13"
dependencies = [
  "cadquery==2.6.1",
  "trimesh>=4.4",
  "numpy>=1.26",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
deployment-station-export = "deployment_station.export:main"
deployment-station-validate = "deployment_station.validation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
